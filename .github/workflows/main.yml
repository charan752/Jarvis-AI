name: Build JARVIS APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest

steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Verify Gradle wrapper
    run: |
      test -f gradle/wrapper/gradle-wrapper.properties
      test -f gradle/wrapper/gradle-wrapper.jar
      echo "Gradle wrapper files found"
      cat gradle/wrapper/gradle-wrapper.properties

  - name: Accept Android SDK licenses
    run: |
      SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
      if [ ! -x "$SDKMANAGER" ]; then
        SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
      fi
      if [ ! -x "$SDKMANAGER" ]; then
        echo "ERROR: sdkmanager not found"
        exit 1
      fi
      set +o pipefail
      yes | "$SDKMANAGER" --licenses
      result=${PIPESTATUS[1]}
      set -o pipefail
      if [ "$result" -ne 0 ]; then
        exit "$result"
      fi

  - name: Ensure Secrets plugin files exist
    run: |
      if [ ! -f .env.example ]; then
        touch .env.example
      fi
      if [ ! -f .env ]; then
        cp .env.example .env
      fi

  - name: Create debug keystore
    run: |
      keytool -genkeypair \
        -keystore debug.keystore \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -dname "CN=Android Debug,O=Android,C=US"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build Debug APK
    run: |
      chmod +x ./gradlew
      ./gradlew :app:assembleDebug --stacktrace

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: JARVIS-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
