name: Build JARVIS APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest

steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Verify project files
    run: |
      echo "Checking project structure..."
      test -f gradle/wrapper/gradle-wrapper.properties || {
        echo "ERROR: gradle-wrapper.properties is missing"
        exit 1
      }
      test -f gradle/wrapper/gradle-wrapper.jar || {
        echo "ERROR: gradle-wrapper.jar is missing"
        exit 1
      }
      test -f gradlew || {
        echo "ERROR: gradlew is missing"
        exit 1
      }
      cat gradle/wrapper/gradle-wrapper.properties

  - name: Accept Android SDK licenses
    shell: bash
    run: |
      set -e
      SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
      SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      if [ ! -x "$SDKMANAGER" ]; then
        SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
      fi

      if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
        echo "ERROR: Android SDK sdkmanager not found"
        exit 1
      fi

      set +e
      yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
      sdk_status=${PIPESTATUS[1]}
      set -e

      if [ "$sdk_status" -ne 0 ]; then
        echo "ERROR: Android SDK license acceptance failed"
        exit "$sdk_status"
      fi

  - name: Prepare Secrets plugin files
    run: |
      if [ ! -f .env.example ]; then
        touch .env.example
      fi
      if [ ! -f .env ]; then
        cp .env.example .env
      fi

  - name: Create debug keystore
    run: |
      keytool -genkeypair \
        -v \
        -keystore debug.keystore \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -dname "CN=Android Debug,O=Android,C=US"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build JARVIS Debug APK
    run: |
      chmod +x ./gradlew
      ./gradlew :app:assembleDebug --stacktrace

  - name: Upload APK artifact
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: JARVIS-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
